name: Premium Bandai freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: stock-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Load latest health state
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install notification dependency
        run: pip install requests==2.34.2
      - name: Check last complete scan
        env:
          DISCORD_ERROR_WEBHOOK: ${{ secrets.DISCORD_ERROR_WEBHOOK }}
        run: python -u premium_bandai_health.py
      - name: Persist acknowledged incident and recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium_bandai_health.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Premium Bandai health incident state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
