name: Parkage singles activation confirmation

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - ".github/workflows/parkage-singles-activation-confirmation.yml"

permissions:
  contents: read

jobs:
  confirm:
    if: github.head_ref == 'ops/parkage-singles-activation' && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.34.2
      - name: Send one clearly labeled activation confirmation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from notifier import construire_embed, envoyer_payload_discord, obtenir_webhook_discord

          stock = json.loads(Path("ancien_stock.json").read_text(encoding="utf-8"))
          cartes = stock["Parkage — Cartes à l’unité"]
          carte = cartes.get("https://www.parkage.com/fr/1147754") or next(iter(cartes.values()))
          exemple = construire_embed({
              **carte,
              "type_alerte": "TEST D’ACTIVATION · EXEMPLE",
          })
          envoyer_payload_discord(obtenir_webhook_discord(), {
              "content": (
                  "✅ **Suivi Parkage activé — cartes One Piece à l’unité**\n"
                  "Le tracker surveille les Leaders alternatifs, les Secret Rare standard "
                  "et les Super Rare standard. La carte ci-dessous est un exemple tiré du "
                  "catalogue initial."
              ),
              "embeds": [exemple],
          })
          PY
