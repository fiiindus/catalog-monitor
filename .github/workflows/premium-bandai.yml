name: Premium Bandai watch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scanners/premium_bandai.py'
      - 'premium_bandai_*.py'
      - '.github/workflows/premium-bandai.yml'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: stock-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  premium-bandai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load latest shared history after waiting for the lock
        if: github.ref_name == 'main'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Scan Premium Bandai
        if: github.ref_name == 'main'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ERROR_WEBHOOK: ${{ secrets.DISCORD_ERROR_WEBHOOK }}
        run: python -u premium_bandai_watch.py

      - name: Live discovery without notifications or state writes
        if: github.ref_name != 'main'
        run: python -u premium_bandai_watch.py --dry-run

      - name: Save shared stock and alert history
        if: always() && github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ancien_stock.json alertes_envoyees.json
          if [[ -f premium_bandai_health.json ]]; then
            git add premium_bandai_health.json
          fi
          if git diff --cached --quiet; then
            echo "✅ Aucun changement d'état"
          else
            git commit -m "Update Premium Bandai stock history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
